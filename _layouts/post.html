---
layout: default
---
<article class="post-single">
  <div class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</div>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-content">
    {{ content }}
  </div>

  <div class="subscribe-box" style="margin-top:40px;">
    <h4>Enjoyed this post?</h4>
    <p class="subscribe-sub">Subscribe to get notified whenever I publish something new.</p>
    <form
      action="https://buttondown.com/api/emails/embed-subscribe/ysultankpg"
      method="post"
      class="embeddable-buttondown-form"
    >
      <label for="bd-email-post">Enter your email</label>
      <input type="email" name="email" id="bd-email-post" />
      <input type="submit" value="Subscribe" />
      <p>
        <a href="https://buttondown.com/refer/ysultankpg" target="_blank">
        </a>
      </p>
    </form>
  </div>

  <a class="back-to-blog" href="{{ '/blog/' | relative_url }}">← Back to all posts</a>
</article>
