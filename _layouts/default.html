<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {% endif %}Yousuf Sultan</title>
<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}Lead Data Analyst with 13+ years building enterprise analytics, BI, and automation platforms.{% endif %}">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/sections.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/pages.css' | relative_url }}">
</head>
<body>

<div class="grain"></div>

<nav class="nav">
  <a href="{{ '/' | relative_url }}" class="nav-brand">yousuf<span>sultan</span></a>
  <button class="hamburger" id="hamburger" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>
  <div class="nav-links" id="nav-menu">
    <a href="{{ '/#about' | relative_url }}">About</a>
    <a href="{{ '/#experience' | relative_url }}">Experience</a>
    <a href="{{ '/#agents' | relative_url }}">Agents</a>
    <a href="{{ '/#projects' | relative_url }}">Projects</a>
    <a href="{{ '/#skills' | relative_url }}">Skills</a>
    <a href="{{ '/blog/' | relative_url }}">Blog</a>
    <a href="{{ '/works/' | relative_url }}">My Works</a>
    <a href="{{ '/#contact' | relative_url }}">Contact</a>
    <div class="theme-switcher" id="theme-switcher">
      <button data-theme="light" title="Light" class="theme-btn">☀️</button>
      <button data-theme="dark" title="Dark" class="theme-btn">🌙</button>
      <button data-theme="system" title="System" class="theme-btn active">💻</button>
    </div>
  </div>
</nav>

<main class="page-content">
  {{ content }}
</main>

<footer><div class="container"><p>2026 Yousuf Sultan</p></div></footer>

<script src="{{ '/theme.js' | relative_url }}"></script>
<script>
  document.getElementById("hamburger").addEventListener("click", () => {
    document.getElementById("nav-menu").classList.toggle("open");
  });
</script>
</body>
</html>
